# Alternativa si tienes Docker Desktop: levanta PostgreSQL ya configurado.
# Uso:  docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: ms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: ms_catalogo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
